<!DOCTYPE html>
<html lang=en">

<head>
    <meta charset="UTF-8">
    <title>HelpDesk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CreationCompteEtudiant .css">
    <link rel="icon" type="image/png" href="Images/logo.png" sizes="32x32" />
    <title>Document</title>
</head>

<body>
    <div id="containerLogin">


        <div id="imgContainer">
            <img src="Images/logo.png" alt="logo" id="imgLogo">
        </div>


        <form id="Form" name="Form">

            <fieldset>
                <h1>Create your student account</h1>

                <div id="divInfo">

                    <input type="text" name="firstName" id="firstName" placeholder="First name">
                    <div class="divErreurLeft">
                        <p id="firstNameError"></p>
                    </div>

                    <input type="text" name="lastName" id="lastName" placeholder="Last name">
                    <div class="divErreurLeft">
                        <p id="lastNameError"></p>
                    </div>

                    <input type="text" name="tel" id="tel" placeholder="Tel" autocomplete="tel">
                    <div class="divErreurLeft">
                        <p id="telError"></p>
                    </div>

                    <input type="text" name="email" id="email" placeholder="Email" autocomplete="email">
                    <div class="divErreurLeft">
                        <p id="emailError"></p>
                    </div>

                    <input type="text" name="password" id="password" placeholder="Password">
                    <div class="divErrorLeft">
                        <p id="passwordError">
                        <ul>
                        </ul>
                        </p>

                    </div>

                    <div id="divBirthday">
                        <label for="birthday" id="labelBirthday">Birthday</label>
                        <input type="date" name="birthday" id="birthday">

                    </div>
                    <p id="birthdayError"></p>

                    <input type="submit" value="Créer mon compte" id="btCreateAccount">
                    <div id="divLink">
                        <a href=""> Avez-vous déjà un compte ? Connectez-vous</a>
                        <a href=""> Faites-vous partie de l'administration ?</a>
                        <a href=""> Êtes-vous Tuteur ?</a>
                    </div>


                </div>




            </fieldset>

        </form>

    </div>
</body>
<script src="CreationCompteEtudiant.js"></script>

</html>
